apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

android {
  namespace "com.yn.sodiumeditor"
  compileSdk 35

  defaultConfig {
    minSdk 23
    targetSdk 35
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  testOptions {
    unitTests.includeAndroidResources = true
    unitTests.all { t ->
      // Robolectric unit tests can fail in some environments with UnsatisfiedLinkError due to
      // native library loading. Exclude them by default; run explicitly with:
      //   gradle :sodium-editor:testDebugUnitTest -PsodiumEditorRunRobolectric=true
      def runRobolectric = (project.findProperty("sodiumEditorRunRobolectric") ?: "false").toString().toBoolean()
      if (!runRobolectric) {
        t.filter {
          setFailOnNoMatchingTests(false)
          excludeTestsMatching "com.yn.sodiumeditor.test.DeepEditorTest"
          excludeTestsMatching "com.yn.sodiumeditor.test.RealFileDeleteLineTest"
        }
      }
    }
  }
}



dependencies {
  implementation 'androidx.appcompat:appcompat:1.7.0'
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.robolectric:robolectric:4.12.2'
  testImplementation 'androidx.test:core:1.6.1'

  androidTestImplementation 'junit:junit:4.13.2'
  androidTestImplementation 'androidx.test:runner:1.5.2'
  androidTestImplementation 'androidx.test.ext:junit:1.1.5'
}
